/* Pan / zoom for the standalone canvas. CSS zoom keeps the document scrollable at every level, so scrollbars,
   drag-to-pan and Ctrl+wheel all work. Skipped inside an iframe (Claude Design supplies its own controls). */
(function () {
  if (window.self !== window.top || new URLSearchParams(location.search).get('only')) return;
  var stage = document.getElementById('stage'), z = 1;
  var W = function () { return window.__W || 8400; }, H = function () { return window.__H || 17000; };
  var bar = document.createElement('div'); bar.id = 'zoom';
  bar.innerHTML = '<button data-z="fit">Fit row</button><button data-z="all">Fit all</button><button data-z="0.5">50%</button><button data-z="1">100%</button><button data-z="-">−</button><span class="pct">100%</span><button data-z="+">+</button>';
  document.body.appendChild(bar);
  function set(nz, cx, cy) { /* keep the point under (cx,cy) fixed */
    nz = Math.max(.1, Math.min(2, nz)); var sx = window.scrollX, sy = window.scrollY;
    if (cx == null) { cx = innerWidth / 2; cy = innerHeight / 2; }
    var dx = (sx + cx) / z, dy = (sy + cy) / z; z = nz; stage.style.zoom = z;
    window.scrollTo(dx * z - cx, dy * z - cy);
    bar.querySelector('.pct').textContent = Math.round(z * 100) + '%';
    bar.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b.dataset.z === String(z)); });
  }
  bar.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; var v = b.dataset.z;
    if (v === 'fit') set((innerWidth - 40) / W()); else if (v === 'all') set(Math.min((innerWidth - 40) / W(), (innerHeight - 40) / H())); else if (v === '+') set(z * 1.25); else if (v === '-') set(z / 1.25); else set(+v); });
  addEventListener('wheel', function (e) { if (!e.ctrlKey) return; e.preventDefault(); set(z * (e.deltaY < 0 ? 1.1 : 1 / 1.1), e.clientX, e.clientY); }, { passive: false });
  addEventListener('keydown', function (e) { if (!(e.ctrlKey || e.metaKey)) return; if (e.key === '=' || e.key === '+') { e.preventDefault(); set(z * 1.25); } else if (e.key === '-') { e.preventDefault(); set(z / 1.25); } else if (e.key === '0') { e.preventDefault(); set(1); } });
  /* drag the empty canvas to pan (phones keep their own gestures) */
  var pan = null;
  stage.addEventListener('mousedown', function (e) { if (e.button !== 0 || e.target.closest('.frame')) return; pan = { x: e.clientX, y: e.clientY, sx: window.scrollX, sy: window.scrollY }; document.body.classList.add('panning'); e.preventDefault(); });
  addEventListener('mousemove', function (e) { if (pan) window.scrollTo(pan.sx - (e.clientX - pan.x), pan.sy - (e.clientY - pan.y)); });
  addEventListener('mouseup', function () { pan = null; document.body.classList.remove('panning'); });
  set((innerWidth - 40) / W()); /* open on a whole row */
})();
</script>

    { name: 'Ready & Pending', flow: 'ready, in-stock on, pane = pending book as a journey → a card picked, pane = that order → pending sub-menu: four situations, grid → list', phone: [], web: [['Ready · in-stock filter on, pane = all pending as a journey', WebDReady3], ['Ready · order picked, pane = that order, All pending goes back', WebDReadySel], ['Pending · four situations, grid, order pane', WebDPendingGrid], ['Pending · list view', WebDPendingList]] },

];
/* ── FINALS · module → sub-menu → screens in flow order. Indexes point into FIN (phone) and WEB (laptop);

const BOARD = [
  { module: 'Catalogue', note: 'picture-first grid · product pages · scan · carts · sale orders', subs: [
    { name: 'Catalogue', flow: 'grid → list → filters → listening → product, customer → salesperson (3) → scan → full-screen viewer', phone: [1, 2, 3, 5, 4, 6, 7, 8, 9, 10, 11], web: [1, 2, 4, 5, 6, 14] },
    { name: 'Carts', flow: 'carts → cart card over the catalogue', phone: [12, 13], web: [7] },
    { name: 'Sale orders', flow: 'cards → table → group by → opened order → analytics (orders, designs, customers)', phone: [15, 16, 17, 18, 19, 20, 21], web: [8, 9, 10, 11, 12, 13] },
  ] },
  { module: 'App shell', note: 'navigation shared by every module', subs: [
    { name: 'Navigation', flow: 'phone side menu · web sidebar expanded (rail, tab strip and header v2 are on every web final)', phone: [14], web: [3] },
  ] },
];
/* flat lists for ?only= on new drafts: n-<i> / nd-<i> (phone light / dark), nw-<i> / nwd-<i> (web) */
const ND_PHONE = [], ND_WEB = []; NEW_DRAFTS.forEach(m => m.subs.forEach(s => { s.phone.forEach(e => ND_PHONE.push(e)); s.web.forEach(e => ND_WEB.push(e)); }));
const ONLY = { f: { T: FINAL, screens: FIN }, fd: { T: FINALD, screens: FIN }, w: { T: FINAL, screens: WEB, web: true }, wd: { T: FINALD, screens: WEB, web: true },
  n: { T: FINAL, screens: ND_PHONE }, nd: { T: FINALD, screens: ND_PHONE }, nw: { T: FINAL, screens: ND_WEB, web: true }, nwd: { T: FINALD, screens: ND_WEB, web: true } };
const X0 = 60, GAP = 30, PAD = 24, CAP = 44, SECTION_GAP = 700;
const geo = r => r.web ? { dx: 1340, per: 3, lh: 900, w: 1280, h: 800 } : { dx: 460, per: 9, lh: 1000, w: 390, h: 844 };
const Device = ({ web, T, Scr }) => web ? <LaptopDevice width={1280} height={800} dark={T.dark}><Scr T={T} /></LaptopDevice> : <IOSDevice width={390} height={844} dark={T.dark}><Scr T={T} /></IOSDevice>;
/* table columns: label · phone (3 pairs per line) · web (2 pairs per line) */
const LBL = { x: X0, w: 300 };
const PH = { w: 390, h: 844, pair: 390 * 2 + GAP, per: 3, colGap: 44, lh: 844 + CAP + 40 };
PH.cellW = PAD * 2 + PH.per * PH.pair + (PH.per - 1) * PH.colGap; PH.x = LBL.x + LBL.w + GAP; PH.fx = PH.x + PAD;
const WB = { w: 1280, h: 800, outer: 1308, pair: 1308 * 2 + GAP, per: 2, colGap: 44, lh: 838 + CAP + 40 };
WB.cellW = PAD * 2 + WB.per * WB.pair + (WB.per - 1) * WB.colGap; WB.x = PH.x + PH.cellW + GAP; WB.fx = WB.x + PAD;
const BOARD_RIGHT = WB.x + WB.cellW;
function Row({ r, y }) {
  const g = geo(r);

    <div className="row-label" style={{ top: y - 130 }}><span className={'badge' + (r.isNew ? ' new' : '')}>{r.label}</span>{r.title}<small>{r.sub}</small></div>
    {r.screens.map(([name, Scr], i) => { const x = X0 + (i % g.per) * g.dx, yy = y + Math.floor(i / g.per) * g.lh; return <React.Fragment key={name}>
      <div className="cap" style={{ left: x, top: yy - 30, maxWidth: g.dx - 20 }}>{name}</div>
      <div className="frame" style={{ left: x, top: yy }} id={r.id + '-' + (i + 1)}><Device web={r.web} T={r.T} Scr={Scr} /></div>
    </React.Fragment>; })}
  </>;
}
const rowH = r => { const g = geo(r); return Math.ceil(r.screens.length / g.per) * g.lh + 100; };

const DRAFTS_END = YS[YS.length - 1] + rowH(DRAFTS[DRAFTS.length - 1]);
/* light + dark pair of one screen, with a big caption. entry = { name, Scr, idL, idD } */
function Pair({ web, entry, x, y, n }) {
  const w = web ? WB.outer : PH.w;
  return <>
    <div className="capL" style={{ left: x, top: y - CAP, width: w * 2 + GAP }}><span className="num">{n}</span><span className="name">{entry.name}</span><span className="ld">light · dark</span></div>
    <div className="frame" style={{ left: x, top: y }} id={entry.idL}><Device web={web} T={FINAL} Scr={entry.Scr} /></div>
    <div className="frame" style={{ left: x + w + GAP, top: y }} id={entry.idD}><Device web={web} T={FINALD} Scr={entry.Scr} /></div>
  </>;
}
/* resolve a screen reference into an entry: finals use indexes into FIN / WEB, new drafts use [name, Scr] */
const resolveFinal = (web, idx) => { const [name, Scr] = (web ? WEB : FIN)[idx - 1]; const L = web ? 'w' : 'f'; return { name, Scr, idL: L + '-' + idx, idD: L + 'd-' + idx }; };
const resolveDraft = (web, e) => { const list = web ? ND_WEB : ND_PHONE; const i = list.indexOf(e) + 1; const L = web ? 'nw' : 'n'; return { name: e[0], Scr: e[1], idL: L + '-' + i, idD: L + 'd-' + i }; };
function layoutBoard(y0, defs, resolve) {
  let y = y0; const items = [];
  items.push({ type: 'head', y }); y += 70;
  defs.forEach(m => {
    items.push({ type: 'module', y, name: m.module, note: m.note }); y += 110;
    m.subs.forEach(s => {
      const pl = Math.ceil(s.phone.length / PH.per), wl = Math.ceil(s.web.length / WB.per);
      const h = PAD + CAP + Math.max(pl * PH.lh, wl * WB.lh, PH.lh) - 40 + PAD;
      items.push({ type: 'sub', y, h, name: s.name, flow: s.flow, module: m.module, np: s.phone.length, nw: s.web.length });
      const fy = y + PAD + CAP;
      s.phone.forEach((ref, i) => items.push({ type: 'pair', web: false, entry: resolve(false, ref), n: i + 1, x: PH.fx + (i % PH.per) * (PH.pair + PH.colGap), y: fy + Math.floor(i / PH.per) * PH.lh }));
      s.web.forEach((ref, i) => items.push({ type: 'pair', web: true, entry: resolve(true, ref), n: i + 1, x: WB.fx + (i % WB.per) * (WB.pair + WB.colGap), y: fy + Math.floor(i / WB.per) * WB.lh }));

function Table({ laid }) {

  return <>{laid.items.map((it, k) => {
    if (it.type === 'head') return <React.Fragment key={k}><div className="th" style={{ left: LBL.x, width: LBL.w, top: it.y }}>Module › sub-menu</div><div className="th" style={{ left: PH.x, width: PH.cellW, top: it.y }}>Phone · 390 × 844 · light + dark</div><div className="th" style={{ left: WB.x, width: WB.cellW, top: it.y }}>Web · 1280 × 800 · light + dark</div></React.Fragment>;
    if (it.type === 'module') return <div key={k} className="module" style={{ top: it.y, width: BOARD_RIGHT - X0 }}><span className="badge new">{it.name[0]}</span>{it.name}<small>{it.note}</small></div>;
    if (it.type === 'sub') return <React.Fragment key={k}>
      {cell(LBL.x, LBL.w, it.y, it.h, { background: 'rgba(31,22,19,.05)' })}
      <div className="lbl" style={{ left: LBL.x, width: LBL.w, top: it.y, height: it.h }}><div className="lbl-mod">{it.module}</div><div className="lbl-sub">{it.name}</div><div className="lbl-flow">{it.flow}</div><div className="lbl-n">{it.np} phone · {it.nw} web</div></div>
      {cell(PH.x, PH.cellW, it.y, it.h)}
      {cell(WB.x, WB.cellW, it.y, it.h)}
    </React.Fragment>;
    return <Pair key={k} web={it.web} entry={it.entry} n={it.n} x={it.x} y={it.y} />;
  })}</>;
}
/* section positions: Drafts · gap · New drafts · gap · Finals */
const NEW_TOP = DRAFTS_END + SECTION_GAP;
const NEW_LAID = NEW_DRAFTS.length ? layoutBoard(NEW_TOP + 260, NEW_DRAFTS, resolveDraft) : { items: [], end: NEW_TOP + 260 + 260 };
const FINALS_TOP = NEW_LAID.end + SECTION_GAP;
const LAID = layoutBoard(FINALS_TOP + 260, BOARD, resolveFinal);
function Canvas() {
  const q = new URLSearchParams(location.search); const only = q.get('only');
  if (only) { const [rid, n] = only.split('-'); const r = DRAFTS.find(x => x.id === rid) || ONLY[rid] || DRAFTS[0]; const Scr = (r.screens[(+n || 1) - 1] || r.screens[0])[1]; const g = geo(r);
    if (q.get('bare') != null) { /* no device frame: the screen fills the viewport */
      document.getElementById('stage').style.cssText = 'width:100vw;height:100dvh'; document.body.style.background = r.T.dark ? '#000' : r.T.bg; document.documentElement.style.overflow = 'hidden';
      return <div style={{ position: 'absolute', inset: 0, overflow: 'hidden', paddingTop: 'env(safe-area-inset-top)' }}><Scr T={r.T} /></div>; }
    document.getElementById('stage').style.cssText = `width:${g.w + 80}px;height:${g.h + 90}px` + (q.get('z') ? ';zoom:' + q.get('z') : ''); document.body.style.background = r.T.dark ? '#0f0b09' : '#D9D0C5';
    return <div className="frame" style={{ left: 30, top: 30 }}><Device web={r.web} T={r.T} Scr={Scr} /></div>; }
  React.useEffect(() => { const st = document.getElementById('stage'); st.style.width = (BOARD_RIGHT + 60) + 'px'; st.style.height = (LAID.end + 120) + 'px'; window.__W = BOARD_RIGHT + 60; window.__H = LAID.end + 120; }, []);
  const W = BOARD_RIGHT - X0;
  return <>
    <div className="section" style={{ top: 20, width: W }}><div className="section-title">Drafts</div><div className="section-sub">Past explorations by module. Catalogue: two originals, two audited duplicates, two ground-up directions.</div></div>
    {DRAFTS.map((r, k) => <Row key={r.id} r={r} y={YS[k]} />)}
    <div className="band" style={{ top: YS[2] - 175, width: W }}><span>Audited duplicates</span></div>
    <div className="band" style={{ top: YS[4] - 175, width: W }}><span>New directions</span></div>
    <div className="section" style={{ top: NEW_TOP, width: W }}><div className="section-title">New drafts</div><div className="section-sub">Modules in planning, drawn in the final design language (light + dark, phone + web). A module moves down to Finals once every screen is signed off.</div></div>
    {NEW_DRAFTS.length ? <Table laid={NEW_LAID} /> : <div className="empty" style={{ top: NEW_TOP + 200, left: X0, width: W }}>No module in planning right now. The next module’s draft screens will appear here, in the same table as the finals below.</div>}
    <div className="section" style={{ top: FINALS_TOP, width: W }}><div className="section-title">Finals</div><div className="section-sub">The finished screens. Rows are modules and their sub-menus; columns are phone and web. Screens run in flow order, each as a light + dark pair.</div></div>
    <Table laid={LAID} />
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Canvas />);
</script></body></html>
