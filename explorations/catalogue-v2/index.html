<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Sutra · design board</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- THE BOARD · the landing page: Overview (what Sutra is, one card per module) and a tab per module with its sub-menus,
     every screen a live front-end mock-up (phone + web, light + dark). Renderer: sheet.jsx (its header lists the
     controls and URL parameters). Files load through loader.js: compiled once in a background worker and kept in the
     browser, modules on demand. Module cards: hub.html. Pannable canvas: board.html?m=<id>.
     Headless (unchanged): index.html?m=<id>&ui=0 · &sub= · &ids=n-3,nwd-7 · ?m=all&sample=1 · &s=0.4 · &v=finals
       bash .claude/skills/sutra-mockups/scripts/contact-sheet.sh (writes .board-check/sheet-*.png) -->
<link rel="stylesheet" href="../../design-system/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Outfit:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Jost:wght@400;500&display=swap">
<link rel="stylesheet" href="board.css">
<link rel="stylesheet" href="sheet.css">
<script>/* React: production build by default; ?dev for readable errors. Vendored in vendor/ (see vendor/README.md). */
(function () { var dev = new URLSearchParams(location.search).has('dev'), f = dev ? 'development' : 'production.min';
  document.write('<script src="vendor/react.' + f + '.js"><\/script><script src="vendor/react-dom.' + f + '.js"><\/script>'); })();</script>
<script src="vendor/lucide.min.js"></script>
<script src="../../design-system/ui_kits/data.js"></script>
<script>/* data.js resolves assets relative to design-system/ui_kits/<kit>/; re-point them from here. */
(function(){var D=window.SUTRA_DATA,o=D.A,n='../../design-system/assets/';D.A=n;D.designs.forEach(function(d){if(d.src)d.src=d.src.replace(o,n)});})();</script>
<script src="modules.js"></script>
<script src="loader.js"></script>
</head>
<body>
<div id="root"><div class="bd-boot"><b>Sutra · design board</b><span id="boot-n">Loading the screens…</span><small>The first visit compiles the screens in this browser; later visits open at once.</small></div></div>
<script>/* the shared files, then finals and the renderer; a browsing visit loads the modules from the page itself, a
   headless run (&ui=0, &ids, &sample) loads the asked-for module(s) first, as before */
(function () {
  var q = new URLSearchParams(location.search), m = q.get('m') || 'all', M = window.SUTRA_MODULES;
  var ui = q.get('ui') !== '0' && !q.has('ids') && !q.has('sample');
  var files = M.base.slice();
  if (!ui) {
    var mods = m === 'all' ? M.modules : M.modules.filter(function (x) { return x.id === m; });
    if (!mods.length) { document.getElementById('root').innerHTML = '<p style="font:16px Jost,sans-serif;padding:40px">No module "' + m + '" in modules.js. Known: ' + M.modules.map(function (x) { return x.id; }).join(', ') + ' · <a href="index.html">board</a></p>'; return; }
    mods.forEach(function (x) { x.files.forEach(function (f) { if (files.indexOf(f) < 0) files.push(f); }); });
  }
  files.push('finals.jsx', 'sheet.jsx');
  var n = document.getElementById('boot-n');
  SutraLoad.onProgress(function (p) { if (n && n.isConnected) n.textContent = 'Loading the screens · ' + p.done + ' / ' + p.total; });
  SutraLoad.run(files);
})();
</script>
</body></html>
