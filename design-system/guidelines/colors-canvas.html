<!DOCTYPE html><html><head><meta charset="utf-8"><title>guidelines/colors-canvas.html</title><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:12px;font:var(--text-body)}.row{display:flex;gap:8px}.sw{flex:1;height:64px;border-radius:var(--r-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font:var(--text-label);letter-spacing:.02em}.sw b{font:var(--text-code);display:block;margin-top:3px;opacity:.75}.lbl{font:var(--text-overline);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw" style="background:var(--sand-0);color:var(--ink-800)">Card<b>--sand-0</b></div><div class="sw" style="background:var(--sand-50);color:var(--ink-800)">Raised<b>--sand-50</b></div><div class="sw" style="background:var(--sand-100);color:var(--ink-800)">Page<b>--sand-100</b></div><div class="sw" style="background:var(--sand-200);color:var(--ink-800)">Sunken<b>--sand-200</b></div><div class="sw" style="background:var(--sand-300);color:var(--ink-800)">Rule<b>--sand-300</b></div><div class="sw" style="background:var(--sand-400);color:var(--ink-800)">Deep<b>--sand-400</b></div></div></body></html>
