<!DOCTYPE html><html><head><meta charset="utf-8"><title>guidelines/colors-semantic.html</title><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:12px;font:var(--text-body)}.row{display:flex;gap:8px}.sw{flex:1;height:64px;border-radius:var(--r-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font:var(--text-label);letter-spacing:.02em}.sw b{font:var(--text-code);display:block;margin-top:3px;opacity:.75}.lbl{font:var(--text-overline);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw" style="background:var(--ok-500);color:var(--sand-50)">OK · in stock · received<b>--ok-500</b></div><div class="sw" style="background:var(--warn-500);color:var(--sand-50)">Warn · partial · due soon<b>--warn-500</b></div><div class="sw" style="background:var(--danger-500);color:var(--sand-50)">Danger · short · overdue<b>--danger-500</b></div><div class="sw" style="background:var(--info-500);color:var(--sand-50)">Info · note · neutral<b>--info-500</b></div></div><div class="row"><div class="sw" style="background:var(--ok-100);color:var(--ink-800)"><b>--ok-100</b></div><div class="sw" style="background:var(--warn-100);color:var(--ink-800)"><b>--warn-100</b></div><div class="sw" style="background:var(--danger-100);color:var(--ink-800)"><b>--danger-100</b></div><div class="sw" style="background:var(--info-100);color:var(--ink-800)"><b>--info-100</b></div></div></body></html>
