<!DOCTYPE html><html><head><meta charset="utf-8"><title>guidelines/motion-states.html</title><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:12px;font:var(--text-body)}.row{display:flex;gap:8px}.sw{flex:1;height:64px;border-radius:var(--r-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font:var(--text-label);letter-spacing:.02em}.sw b{font:var(--text-code);display:block;margin-top:3px;opacity:.75}.lbl{font:var(--text-overline);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}</style></head><body><div style="display:flex;gap:14px;align-items:center"><div style="flex:1;height:72px;border-radius:var(--r-card);background:var(--surface-card);box-shadow:var(--shadow-1);transform:none;;display:flex;align-items:center;justify-content:center;font:var(--text-label)">Rest</div><div style="flex:1;height:72px;border-radius:var(--r-card);background:var(--surface-card);box-shadow:var(--shadow-2);transform:translateY(-1px);background:var(--surface-card-hover);display:flex;align-items:center;justify-content:center;font:var(--text-label)">Hover</div><div style="flex:1;height:72px;border-radius:var(--r-card);background:var(--surface-card);box-shadow:var(--shadow-1);transform:scale(.985);background:var(--bg-raised);display:flex;align-items:center;justify-content:center;font:var(--text-label)">Press</div><div style="flex:1;height:72px;border-radius:var(--r-card);background:var(--surface-card);box-shadow:var(--focus-ring);transform:none;;display:flex;align-items:center;justify-content:center;font:var(--text-label)">Focus</div><span class="lbl" style="flex:1.2">Easing --ease-out · 120/200/320 ms · fades and 8px rises only — no bounces</span></div></body></html>
