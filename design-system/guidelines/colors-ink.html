<!DOCTYPE html><html><head><meta charset="utf-8"><title>guidelines/colors-ink.html</title><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;display:flex;flex-direction:column;gap:12px;font:var(--text-body)}.row{display:flex;gap:8px}.sw{flex:1;height:64px;border-radius:var(--r-sm);display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font:var(--text-label);letter-spacing:.02em}.sw b{font:var(--text-code);display:block;margin-top:3px;opacity:.75}.lbl{font:var(--text-overline);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw" style="background:var(--ink-900);color:var(--sand-50)">Primary<b>--ink-900</b></div><div class="sw" style="background:var(--ink-700);color:var(--sand-50)"><b>--ink-700</b></div><div class="sw" style="background:var(--ink-600);color:var(--sand-50)">Secondary<b>--ink-600</b></div><div class="sw" style="background:var(--ink-500);color:var(--sand-50)"><b>--ink-500</b></div><div class="sw" style="background:var(--ink-400);color:var(--sand-50)">Muted<b>--ink-400</b></div><div class="sw" style="background:var(--ink-300);color:var(--ink-800)"><b>--ink-300</b></div><div class="sw" style="background:var(--ink-200);color:var(--ink-800)"><b>--ink-200</b></div><div class="sw" style="background:var(--ink-100);color:var(--ink-800)"><b>--ink-100</b></div></div></body></html>
