<script type="text/babel">
const SCREENS = [['Catalogue grid', ScreenGrid], ['Product · customer view', ScreenProductCustomer], ['Product · salesperson view', ScreenProductSales], ['Product · analytics & orders', ScreenAnalytics], ['Scan-to-add pop-up', ScreenScan], ['Carts', ScreenCarts]];
function Row({ id, T, y, title, sub }) {
  return <>
    <div className="row-label" style={{ top: y - 130 }}><span className="badge">{id}</span>{title}<small>{sub}</small></div>
    {SCREENS.map(([name, Scr], i) => <React.Fragment key={name}>

    </React.Fragment>)}
  </>;

function Canvas() { const q = new URLSearchParams(location.search); const only = q.get('only'); if (only) { const [row, n] = only.split('-'); const T = row === '1b' ? ATELIER : GALLERY; const Scr = SCREENS[(+n || 1) - 1][1]; document.body.style.cssText = 'width:470px;height:930px;background:' + (T.dark ? '#0f0b09' : '#D9D0C5'); return <div className="frame" style={{ left: 30, top: 30 }}><IOSDevice width={390} height={844} dark={T.dark}><Scr T={T} /></IOSDevice></div>; }
